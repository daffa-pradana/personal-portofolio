<svg viewBox="0 0 1600 1000" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="brandGrad" x1="704" y1="0" x2="842" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0052CC"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1600" height="1000" fill="#7C3AED"/>
  <polygon points="0,0 907,0 640,1000 0,1000" fill="#0052CC"/>

  <circle cx="120"  cy="188" r="5"    fill="#FFFFFF" opacity="0.15"/>
  <circle cx="1493" cy="188" r="5"    fill="#FFFFFF" opacity="0.15"/>
  <circle cx="1267" cy="188" r="3.75" fill="#FFFFFF" opacity="0.12"/>
  <circle cx="867"  cy="188" r="3.75" fill="#FFFFFF" opacity="0.12"/>
  <circle cx="120"  cy="750" r="5"    fill="#FFFFFF" opacity="0.15"/>
  <circle cx="1493" cy="750" r="5"    fill="#FFFFFF" opacity="0.15"/>
  <circle cx="400"  cy="875" r="3.75" fill="#FFFFFF" opacity="0.12"/>
  <circle cx="867"  cy="813" r="3.75" fill="#FFFFFF" opacity="0.12"/>

  <!-- Jira cloud icon (white, on blue panel) -->
  <g>
    <ellipse cx="360" cy="400" rx="137.5" ry="68.75" fill="#FFFFFF"/>
    <circle cx="280" cy="375" r="56.25" fill="#FFFFFF"/>
    <circle cx="360" cy="350" r="68.75" fill="#FFFFFF"/>
    <circle cx="440" cy="375" r="56.25" fill="#FFFFFF"/>
    <text x="360" y="540" text-anchor="middle" font-size="40" font-weight="700" fill="#FFFFFF">Jira</text>
  </g>

  <!-- sync hub straddling the diagonal seam -->
  <g>
