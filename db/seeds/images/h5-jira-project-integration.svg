    <line x1="773" y1="500" x2="808"   y2="500"    stroke="#9CA3AF" stroke-width="1.9"/>
    <line x1="773" y1="500" x2="790.5" y2="469.69" stroke="#9CA3AF" stroke-width="1.9"/>
    <line x1="773" y1="500" x2="755.5" y2="469.69" stroke="#9CA3AF" stroke-width="1.9"/>
    <line x1="773" y1="500" x2="738"   y2="500"    stroke="#9CA3AF" stroke-width="1.9"/>
    <line x1="773" y1="500" x2="755.5" y2="530.31" stroke="#9CA3AF" stroke-width="1.9"/>
    <line x1="773" y1="500" x2="790.5" y2="530.31" stroke="#9CA3AF" stroke-width="1.9"/>

    <circle cx="808"   cy="500"    r="6.25" fill="#7C3AED"/>
    <circle cx="790.5" cy="469.69" r="6.25" fill="#7C3AED"/>
    <circle cx="755.5" cy="469.69" r="6.25" fill="#0052CC"/>
    <circle cx="738"   cy="500"    r="6.25" fill="#0052CC"/>
    <circle cx="755.5" cy="530.31" r="6.25" fill="#0052CC"/>
    <circle cx="790.5" cy="530.31" r="6.25" fill="#7C3AED"/>
    <circle cx="773" cy="500" r="8.75" fill="#172B4D"/>
  </g>

  <!-- Happy5 target icon (white rings, on purple panel) -->
  <g>
    <circle cx="1240" cy="600" r="87.5" fill="none" stroke="#FFFFFF" stroke-width="5"/>
    <circle cx="1240" cy="600" r="60"   fill="none" stroke="#FFFFFF" stroke-width="5"/>
    <circle cx="1240" cy="600" r="32.5" fill="none" stroke="#FFFFFF" stroke-width="5"/>
    <circle cx="1240" cy="600" r="10"   fill="#FFFFFF"/>
    <text x="1240" y="740" text-anchor="middle" font-size="40" font-weight="700" fill="#FFFFFF">Happy5</text>
