# Knowledge base for the portfolio AI chat.
#
# Every entry here is recited to visitors verbatim-ish by the LLM, so:
#   - keep it factual — the system prompt tells the model not to invent, but it
#     can only be as accurate as what it is grounded in
#   - keep it public-safe — no client names, no internal architecture detail
#   - keep it current — stale copy here becomes the bot confidently lying
#
# Content is written third-person ("Daffa"), matching how visitors ask
# ("how can I contact him?").

# --- Who he is ----------------------------------------------------------------

- category: about
  title: Who Daffa is
  content: >
    Daffa Pradana is a backend engineer with five years of production
    experience, based in Indonesia. He works primarily in Ruby on Rails and
    PostgreSQL, building and operating B2B SaaS systems for enterprise
    clients. His focus is the parts of a system most users never see:
    performance, data integrity, and keeping things running when they break.

- category: about
  title: How he works
  content: >
    Daffa does his best work on problems that reward digging — tracing why a
    system is slow, why a job silently failed, why a query that looked fine
    falls over under real traffic. He tends to measure before optimising and
    verify before assuming, and he prefers fixing a root cause over patching a
    symptom.

# --- Experience ---------------------------------------------------------------

- category: experience
  title: Backend Engineer at Happy5 (2021 to present)
  content: >
    Since July 2021 Daffa has been a backend engineer at Happy5, an
    ISO 27001-certified B2B SaaS platform for OKRs, project management, and
    performance reviews, serving enterprise clients including major Indonesian
