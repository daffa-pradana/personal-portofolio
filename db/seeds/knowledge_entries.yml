# --- What he actually did -----------------------------------------------------

- category: highlights
  title: Performance and query optimisation
  content: >
    Daffa took a critical production endpoint from roughly 44 seconds down to
    sub-second. He found the cause with APM tracing and query profiling rather
    than guessing, then fixed it properly: eliminating N+1 patterns through
    association preloading, adding targeted indexes, and introducing Redis
    caching with correct invalidation on high-frequency queries. Separately, he
    improved response time across high-traffic endpoints by around 85%.

- category: highlights
  title: Incident response and post-mortem work
  content: >
    Daffa led the response to a production P1 where a sync job had been
    silently failing for three days, blocking thousands of employees from work
    they needed. He root-caused it, shipped the fix, and — rather than assuming
    the fix was sound — built a custom benchmarking harness to validate a
    parallelisation refactor before rollout. The result was roughly 57% faster
    with zero regression.

- category: highlights
  title: Integrations and product impact
  content: >
    Daffa architected and built a bi-directional Jira integration, designing
    the API contract and data-sync logic, which contributed to two contract
    renewals and one new contract. He also developed a product feature that
    grew platform users tenfold, and cut CI/CD pipeline cost and runtime by
    optimising test suite parallelisation on CircleCI.

# --- Skills -------------------------------------------------------------------

- category: skills
  title: Core tech stack
  content: >
    Daffa's primary stack is Ruby on Rails with PostgreSQL and Redis. He works
    daily with RESTful API design, database schema and index design, query
    profiling with EXPLAIN ANALYZE, background job processing via Sidekiq, and
    RSpec for test coverage. He also writes JavaScript, and has earlier
    hands-on experience with PHP and React.

- category: skills
  title: Infrastructure and reliability
  content: >
    On the infrastructure side Daffa works with Google Kubernetes Engine,
    Docker, AWS S3, and CircleCI for CI/CD. For observability and reliability
    he uses APM profiling, Sentry for error monitoring, Redash for data
    queries, and custom benchmarking when off-the-shelf tooling does not answer
    the question.

- category: skills
  title: AI-assisted development
  content: >
    Daffa uses Claude Code as part of his daily engineering workflow, and has
    built and maintained his own MCP (Model Context Protocol) integrations to
    connect it to the tools he actually uses. He treats AI-generated code the
    same as any other code — read, understood, and either defended or
    overridden before it ships.

# --- This site ----------------------------------------------------------------

- category: projects
  title: This portfolio site and its AI chat
  content: >
    This site is a Rails 8 application Daffa built himself, using Hotwire
    (Turbo and Stimulus) and PostgreSQL. The chat you are using is a retrieval
    augmented generation setup: your question is matched against a curated
    knowledge base, and the relevant entries are passed as grounding context to
    a language model through the Groq API. It is deliberately
    provider-agnostic, speaking the generic OpenAI-compatible contract so the
    model or provider can be swapped through configuration rather than a
    rewrite.

