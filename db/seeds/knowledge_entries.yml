    PostgreSQL, and Redis, deployed on Google Kubernetes Engine — from
    technical spec through production and post-launch reliability. He also
    mentors other engineers, runs code reviews, and leads engineering
    onboarding for new hires.

- category: experience
  title: Earlier roles and how he started
  content: >
    Daffa started out freelancing, taking on PHP and JavaScript projects to
    build real-world experience. He then moved into more structured roles: a
    web programming internship at Merck Indonesia in 2020, building internal
    tools for operations and data management, followed by a short stint at
    4Life Indonesia in early 2021 building responsive product pages in
