- title: "Architecting a Jira Sync Engine for an Enterprise OKR Platform"
  slug: "h5-jira-project-integration"
  subtitle: >
    Designed and owned the domain layer of Happy5 Performance's Jira integration:
    the sync engine that turns Jira projects, issues and workflow states into
    enterprise OKR goals, tasks, ownership and live progress. Nineteen PRs across
    eight months — the core roll-up strategy shipped in October 2022 is still the
    production code path four years later.
