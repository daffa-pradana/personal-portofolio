  body: |
    <h2>At a glance</h2>
    <table>
      <tbody>
        <tr><th>Product</th><td>Happy5 Performance, a multi-tenant enterprise OKR and performance-management SaaS</td></tr>
        <tr><th>My role</th><td>Backend engineer, sole owner of the integration's domain layer</td></tr>
        <tr><th>Duration</th><td>September 2022 to May 2023, eight months</td></tr>
        <tr><th>Shipped</th><td>19 merged pull requests, ~6,800 lines, 17 of the 19 Jira PRs merged in that window</td></tr>
        <tr><th>Stack</th><td>Ruby on Rails, PostgreSQL (schema-per-tenant), Sidekiq, ActionCable, Atlassian Connect, Jira REST v3 + JQL</td></tr>
        <tr><th>Still running</th><td>The progress roll-up strategy I wrote in October 2022 is the production code path today, four years later</td></tr>
      </tbody>
    </table>

    <h2>The one-sentence version</h2>
    <p>I designed the layer that decides what a Jira project <em>means</em> inside an OKR platform: how issues become goals, how workflow states become measurable progress, how Jira's people become accountable owners, and how much of that each customer gets to disagree with.</p>

    <h2>1. The problem nobody puts on the slide</h2>
    <p>"Integrate with Jira" sounds like an afternoon of REST calls. The demo is easy: pick a project, pick a goal, draw a line between them.</p>
    <p>The reality is that an OKR platform and an issue tracker disagree about almost everything, and the integration is the place where those disagreements have to be resolved into a single number that a director will look at in a quarterly review.</p>
    <p>Four boundaries have to be crossed at once.</p>
    <pre class="mermaid">
    flowchart LR
        subgraph JIRA["Jira Cloud"]
            J1["Project → Epic → Task → Subtask&lt;br/&gt;(3 levels below project)"]
            J2["Arbitrary workflow statuses&lt;br/&gt;'In Review', 'QA', 'Blocked'…"]
            J3["Lead, Administrator, Member,&lt;br/&gt;Viewer, Assignee, Reporter, Watcher"]
            J4["Jira is the source of truth&lt;br/&gt;…or is it?"]
        end
        subgraph H5["Happy5 Performance"]
            H1["Project → Task&lt;br/&gt;(2 levels, hard validation)"]
            H2["A percentage.&lt;br/&gt;Rolled up from child records&lt;br/&gt;in our own database."]
            H3["Leader, Assignee, Reviewer,&lt;br/&gt;PMO, Stakeholder&lt;br/&gt;(drives approval + review flows)"]
            H4["Customers each have&lt;br/&gt;a different opinion"]
        end
        J1 -.->|"hierarchy&lt;br/&gt;boundary"| H1
        J2 -.->|"progress&lt;br/&gt;boundary"| H2
        J3 -.->|"identity + role&lt;br/&gt;boundary"| H3
        J4 -.->|"authority&lt;br/&gt;boundary"| H4
    </pre>
    <p>The architecture below is, essentially, four answers to those four questions, plus an async pipeline so none of it happens while a user stares at a spinner.</p>

    <h2>2. Where I came in, and what was already there</h2>
    <p>Being precise about this matters more than claiming the whole thing.</p>
    <p>Our tech lead built the transport in September 2022: the Atlassian Connect app descriptor, JWT authentication, the install and uninstall lifecycle, webhook registration, and the REST client with its JQL builder, cursor pagination and rate-limit backoff. That was done before I wrote a line of Jira code.</p>
    <p>From October 2022 I owned everything above it. For the next eight months I was the only person shipping in that layer.</p>
    <pre class="mermaid">
    gantt
        title Ownership of the Jira integration over time
        dateFormat YYYY-MM
        axisFormat %b %y
        section Transport + trust
        Connect app / JWT / webhooks / REST client (tech lead) :done, 2022-09, 1M
        section Domain sync engine (mine)
        Alignment depth + progress roll-up :active, 2022-09, 2M
        Config / permissions / sync options :active, 2022-11, 2M
        Task + project integration + async pipeline :active, 2023-01, 2M
        Per-tenant mapping policy + hardening :active, 2023-03, 3M
        section After handoff
        User-flow revamp / period fallbacks / AI insights (others) :2023-06, 30M
    </pre>

    <h2>3. The system</h2>
    <pre class="mermaid">
    flowchart TB
        subgraph ATL["Atlassian Cloud"]
            JC["Jira Cloud site"]
            WH["9 registered Connect webhooks&lt;br/&gt;project updated / deleted / archived&lt;br/&gt;issue updated / deleted&lt;br/&gt;comment created / updated / deleted"]
            API["REST API v3&lt;br/&gt;/project /search /user&lt;br/&gt;/role /watchers /attachment"]
        end

        subgraph TRANSPORT["Transport + trust (inherited)"]
            DESC["Descriptor + lifecycle&lt;br/&gt;scopes: read"]
            AUTH["JWT verification"]
            CLIENT["JiraClient&lt;br/&gt;JQL builder · pagination · backoff"]
            WHC["Webhook controllers"]
        end

        subgraph IDENTITY["Identity"]
            INT["Integration (per tenant)"]
            ITEM["Integration::Item&lt;br/&gt;polymorphic join&lt;br/&gt;key = Jira id&lt;br/&gt;object = Objective | User&lt;br/&gt;config = per-link policy"]
        end

        subgraph DOMAIN["Domain sync engine ★ mine"]
            MAP["Jira::ObjectiveService&lt;br/&gt;pure mapping functions"]
            ROLES["Involvement precedence chain"]
            POLICY["Per-tenant mapping policy"]
            IMPORT["Recursive hierarchy import"]
        end

        subgraph PROGRESS["Progress ★ mine"]
            RU["RollUp::AverageByJiraPhase&lt;br/&gt;statusCategory → 0 / 50 / 100"]
        end

        subgraph ASYNC["Async pipeline ★ mine"]
            JOB["SyncIntegrationJob (Sidekiq)"]
            CABLE["ActionCable broadcast"]
        end

        JC --> WH --> WHC
        API &lt;--&gt; CLIENT
        DESC &amp; AUTH --- WHC
        WHC --> MAP
        CLIENT --> MAP
        ITEM --- INT
        MAP --- ITEM
        MAP --> ROLES
        MAP --> POLICY
        MAP --> IMPORT
        MAP -->|after_commit| RU
        RU --> CLIENT
        JOB --> MAP
        JOB --> CABLE

        style DOMAIN fill:#1f6feb22,stroke:#1f6feb
        style PROGRESS fill:#1f6feb22,stroke:#1f6feb
        style ASYNC fill:#1f6feb22,stroke:#1f6feb
    </pre>

    <h2>4. Decision one: progress is a strategy, not a branch</h2>
    <p>The platform already had a family of roll-up strategies. Each one answers "what is this goal's progress?" by reading child records from our own database.</p>
    <p>A Jira-linked goal has no children in our database. Its progress lives in someone else's API, spread across potentially thousands of issues that will never be our records.</p>
    <p>My first implementation threaded Jira context through <code>Progress</code>, the shared class that computes ratios. It worked. It was also wrong, and review caught it: <code>Progress</code> is called from roll-up, from output rendering, and from a customer-specific workflow. A version that takes optional Jira arguments quietly returns inconsistent results everywhere it is called without them.</p>
    <p>So the Jira knowledge went into a strategy class of its own, which writes its answer into the objective's ordinary <code>current_value</code> and <code>target_value</code>. Everything downstream reads normal fields and knows nothing about Jira.</p>
    <pre class="mermaid">
    classDiagram
        class RollUp_Base {
            +roll_up()
            +starting_value()
            +current_value()
            +roll_up_value_updates()
        }
        class Sum
        class WeightedAverage
        class AverageByPhase
        class None
        class AverageByJiraPhase {
            +JIRA_PHASES
            +current_value()
            +value_based_on_child_phase()
            +value_based_on_phase()
            +roll_up_value_updates()
        }
        RollUp_Base &lt;|-- Sum
        RollUp_Base &lt;|-- WeightedAverage
        RollUp_Base &lt;|-- AverageByPhase
        RollUp_Base &lt;|-- None
        RollUp_Base &lt;|-- AverageByJiraPhase
        note for AverageByJiraPhase "Added Oct 2022. Maps statusCategory new/indeterminate/done to 0/50/100. Still the production path in 2026."
    </pre>
    <p>Two guards elsewhere had to widen: both the strategy registry and the roll-up job short-circuited on "this objective has no children", which is correct for local roll-ups and wrong for an integrated one.</p>

    <h3>The part I am most pleased with</h3>
    <p>Every Jira project can invent its own workflow. "In Review", "QA", "Pending Deploy", "Blocked". An OKR platform needs a number, and asking each customer to fill in a status-to-percentage table would have turned a feature into a services engagement.</p>
    <p>But Jira guarantees that every status, whatever it is named, belongs to exactly one of three <code>statusCategory</code> values. So the strategy keys on the category, not the status.</p>
    <pre class="mermaid">
    flowchart LR
        A["'To Do'&lt;br/&gt;'Backlog'&lt;br/&gt;'Icebox'"] --> N["statusCategory: new"] --> Z["0%"]
        B["'In Progress'&lt;br/&gt;'In Review'&lt;br/&gt;'QA'&lt;br/&gt;'Blocked'"] --> I["statusCategory: indeterminate"] --> F["50%"]
        C["'Done'&lt;br/&gt;'Shipped'&lt;br/&gt;'Closed'"] --> D["statusCategory: done"] --> H["100%"]
        Z &amp; F &amp; H --> AVG["average across the project's issues&lt;br/&gt;= the goal's progress"]
    </pre>
    <p>Zero configuration, works on any customer's Jira on day one. The trade-off is stated openly: an issue in "Code Review" and one in "Just Started" both read 50%. That is imprecise, and it is the same imprecision Jira's own board reporting accepts.</p>

    <h2>5. Decision two: mapping one company's org chart onto another's</h2>
    <p>This is the part people underestimate. Our objectives do not have "an assignee". They carry a role graph, and those roles drive who approves the goal and who reviews it at cycle end. Putting a person in the wrong tier has consequences a quarter later.</p>
    <p>Jira has an entirely different vocabulary, and a separate user namespace.</p>
    <pre class="mermaid">
    flowchart LR
        subgraph SRC["Jira"]
            L["project lead"]
            ADM["role: Administrator(s)"]
            MEM["role: Member"]
            ASG["issue assignees"]
            REP["reporters + creators"]
            VIEW["role: Viewer"]
            WAT["issue watchers"]
        end
        subgraph DST["Happy5 objective"]
            LEAD["leader (single)"]
            REV["reviewer (single)"]
            PMO["PMO (many)"]
            OWN["assignee (many)"]
            STK["stakeholder (many)"]
        end
        ORG["Happy5 org chart:&lt;br/&gt;leader's direct manager"]

        L --> LEAD
        LEAD -.->|derived, not read from Jira| ORG --> REV
        ADM --> PMO
        MEM &amp; ASG &amp; REP --> OWN
        VIEW &amp; WAT --> STK

        style ORG fill:#f0ad4e22,stroke:#f0ad4e
    </pre>
    <p>Each tier resolves in order and filters against an accumulator of Jira account IDs already claimed by a higher tier, so a project lead who also watches every issue stays the lead and does not also show up as a stakeholder.</p>
    <p>The reviewer is the interesting one. Jira has no concept of "who signs this off", so the integration <em>synthesises</em> it by walking our own org chart from the mapped leader to their direct manager, then removes that person from every other tier.</p>
    <p>Identity crosses the boundary through a persisted index pairing a Jira account ID with a platform user, queried in bulk rather than per record.</p>
    <p>Hardening came from production. Jira sites name the admin role <code>Administrator</code> or <code>Administrators</code> depending on how they were provisioned, and a project missing an expected role returned nil and took the whole sync down with it.</p>

    <h2>6. Decision three: let each customer disagree</h2>
    <p>The mapping above is opinionated. Enterprise customers did not all share the opinion.</p>
    <p>In February 2023, one client's biweekly produced a requirement: their tribe leaders are assigned as reviewers by an internal process, so Jira must never overwrite the reviewer. Another wanted Jira's owner to be added alongside the existing one, not to replace it. A third had a security position on attachments.</p>
    <p>The tempting move is a per-customer branch. The right move is to notice that "customer X wants different behaviour" is an architecture question, and that all three requests are the same question asked about different fields: <strong>when both sides have a value, who wins?</strong></p>
    <p>So I specified a policy vocabulary, three verbs with uniform meaning across every mapped field:</p>
    <table>
      <thead><tr><th>Value</th><th>Meaning</th></tr></thead>
      <tbody>
        <tr><td><code>replace</code></td><td>Drop what we have, install what Jira says</td></tr>
        <tr><td><code>add_new</code></td><td>Keep what we have, add what Jira says</td></tr>
        <tr><td><code>no</code></td><td>Keep what we have, ignore Jira</td></tr>
      </tbody>
    </table>
    <p>Which becomes per-tenant configuration, validated at the admin API boundary:</p>
    <pre><code>jira_project_mapping: {
      sync_objective_reviewer:    "replace" | "no"
    }
    jira_issue_mapping: {
      sync_objective_owner:       "replace" | "add_new",
      sync_objective_reviewer:    "replace" | "no",
      sync_objective_attachments: "add_new" | "no"
    }</code></pre>
    <p>Review improved it before it was built: make the values strings rather than booleans, so the set can grow later without a schema migration. That single note is why the design survived the next three years of requests.</p>
    <p>Control sits at three deliberately different scopes:</p>
    <pre class="mermaid">
    flowchart TB
        ORG["Per organisation&lt;br/&gt;&lt;b&gt;who wins on each field&lt;/b&gt;&lt;br/&gt;jira_project_mapping&lt;br/&gt;jira_issue_mapping"]
        LINK["Per link&lt;br/&gt;&lt;b&gt;how much to sync&lt;/b&gt;&lt;br/&gt;sync_option: all | measurement_only&lt;br/&gt;import_child_issues: bool"]
        ROLE["Per role group&lt;br/&gt;&lt;b&gt;who can see it at all&lt;/b&gt;&lt;br/&gt;permission: jira.component.see"]
        ORG --> LINK --> ROLE
    </pre>
    <p>The full path from a client meeting to a configuration primitive took three weeks. That is the piece of this project I would put on a slide.</p>

    <h2>7. Decision four: get off the request path</h2>
    <p>Linking a real project meant: fetch the project, fetch each project role, search every issue, fetch watchers per issue, then write N objectives. Our APM flagged it. Then a customer proved it, with a project holding 1,722 issues inside a tenant with more than 10,000 tickets. The preview call timed out at two minutes.</p>
    <pre class="mermaid">
    sequenceDiagram
        participant U as User
        participant API as Rails API
        participant Q as Sidekiq
        participant J as Jira REST
        participant WS as ActionCable

        U->>API: POST /objectives/:id/integrations
        API->>API: validate, persist link, record activity
        API-->>U: 202 Accepted
        Note over U,API: request ends here

        API->>Q: enqueue SyncIntegrationJob
        Q->>J: fetch project / issue
        J-->>Q: payload
        Q->>Q: map to objective params
        Q->>Q: apply tenant policy + sync_option
        Q->>Q: persist inside transaction
        Q->>Q: after_commit → enqueue RollUpJob
        Q->>Q: import child issues (if requested)
        Q->>Q: enforce alignment (if requested)
        Q->>WS: broadcast result
        WS-->>U: UI updates live
    </pre>
    <p><strong>And then I broke it.</strong> Making the link asynchronous meant child import and alignment enforcement fired <em>alongside</em> the sync instead of after it. Child issues could be created before the parent project had finished syncing and had its section created. Production threw, and our error tracker caught it.</p>
    <p>The fix was 32 lines added and 16 removed: run the three phases sequentially inside one unit of work rather than as three independent async units.</p>
    <p>I like this story because "make it async" gets treated as a free performance win. It is not. It is a design decision that buys latency with ordering guarantees, and you pay for it the first time two jobs race.</p>

    <h2>8. The prerequisite nobody asked for</h2>
    <p>Before any of the above could work, one thing blocked the entire project integration milestone: our objective model enforced two levels of task alignment. Jira has three below a project.</p>
    <pre class="mermaid">
    flowchart LR
        subgraph J["Jira"]
            P1["Project"] --> E["Epic"] --> S["Story / Task"] --> T["Subtask"]
        end
        subgraph B["Happy5 before"]
            P2["Project"] --> TK["Task"] --> ST["Subtask"]
            X["3rd level: rejected by validator"]:::bad
        end
        subgraph A["Happy5 after"]
            P3["Project"] --> TK2["Task"] --> ST2["Subtask"] --> ST3["Sub-subtask"]
        end
        classDef bad fill:#d9534f22,stroke:#d9534f
    </pre>
    <p>The choice was to flatten Jira's hierarchy on import and lose information permanently, or to change the core data model. I changed the model: 664 lines added and 372 removed across 36 files, touching validators, parent-suggestion queries and the filtering API, merged nine days before the first Jira roll-up landed.</p>
    <p>Imported trees keep their shape, and the importer became a straightforward recursive walk instead of a flattening heuristic.</p>

    <h2>9. What it cost</h2>
    <p>Some honest numbers, because a case study without them is marketing.</p>
    <ul>
      <li>The largest PR ran to <strong>100 commits over five weeks in review</strong>. Most of that was not coding. It was arguing about where logic belonged, and most of those arguments improved the result.</li>
      <li>One requirements misread cost two round trips: a fix reset both the roll-up and the measurement unit on unlink, and product came back to say only the roll-up should reset. The correction was a <strong>net deletion</strong>, minus 36 lines and plus 28, including removing a guard that had blocked editing an integrated goal at all. I would rather ship a negative diff than another conditional.</li>
      <li>I spent five rounds in a PR thread failing to make an ORM produce a correct join across our schema-per-tenant Postgres layout, before writing the SQL by hand. Trying the idiomatic approaches first was right. Continuing to try them after they had visibly failed was not.</li>
      <li>Working against an undisclosed rate limit shaped several decisions. One change was approved with an explicit condition attached: watch production 429 rates after deploy, and enhance further if they spike. Shipping with a stated watch condition beats shipping with a hope.</li>
    </ul>

    <h2>10. What actually lasted</h2>
    <p>In June 2026, three years after I handed the integration to another team, a pull request landed to make the Jira roll-up tolerate a deleted issue instead of aborting the whole batch. It came to me for review.</p>
    <p>The constant it modifies is the one I wrote in October 2022. Same name, same three values, same dispatch, still the production code path.</p>
    <p>Between then and now the integration absorbed a full user-flow revamp, period-fallback handling, an AI productivity-insight feature built on its data, a migration off a deprecated Jira endpoint, and a service split into two. None of it required a rewrite of the strategy class, the per-link config bag, the tenant mapping policy or the async pipeline.</p>
    <p>That is the only design review that counts: not whether it was elegant on the day, but whether the next four years of requirements could be absorbed without tearing it out.</p>

    <h2>11. What I would do differently</h2>
    <p><strong>Version the mapping policy from day one.</strong> Three verbs turned out to be the right vocabulary, but I added them per field as customers asked. A tenant that upgrades mid-quarter gets new defaults applied to goals mid-cycle, and we never gave ourselves a clean way to say "this link was created under mapping v1".</p>
    <p><strong>Design the ordering before making it async, not after.</strong> The race I introduced was predictable the moment three operations stopped sharing a call stack. Ten minutes with a sequence diagram would have caught it; instead, production did.</p>
    <p><strong>Push back earlier on precise date mapping.</strong> Deriving a project's start and due date from the extremes of its issue set is elegant and generates an unbounded tail of edge cases: issues with only one date, due dates before start dates, children violating a parent's window. A static period per link would have cost the team weeks less. I raised this late, when the layered failures were already in front of us.</p>

    <h2>12. The takeaway</h2>
    <p>The hard part of integration work is not transport. Anyone can call a REST endpoint and parse the JSON.</p>
    <p>The hard part is semantic: deciding what a foreign system's concepts <em>mean</em> inside yours, finding the invariant that lets one mapping serve every customer, and then being honest about where that mapping has to become a setting because the customers genuinely disagree.</p>
    <p>Get that layer right and the transport underneath it can be replaced, the UI on top of it can be revamped twice, and the thing still works four years later.</p>

    <p><em>Backend engineer on Happy5 Performance, 2021 to present. This project ran September 2022 to May 2023.</em></p>

