- title: "Architecting a Jira Sync Engine for an Enterprise OKR Platform"
  slug: "h5-jira-project-integration"
  subtitle: >
    Designed and owned the domain layer of Happy5 Performance's Jira integration,
    the sync engine that turns Jira projects, issues and workflow states into
    enterprise OKR goals, tasks, ownership and live progress. Still the production
    code path four years later.
  article_type: case_study
  status: published
  tags:
    - "Ruby on Rails"
    - "Jira REST API"
    - "Sidekiq"
    - "ActionCable"
    - "PostgreSQL"
  button_label: "Product Page"
  button_url: "https://www.happy5.co/product/project-management-tracker"
  position: 1
  body: |
    <h2>At a glance</h2>
    <table>
      <tbody>
        <tr><th>Product</th><td>Happy5 Performance, a multi-tenant enterprise OKR and performance-management SaaS</td></tr>
        <tr><th>My role</th><td>Backend engineer, sole owner of the integration's domain layer</td></tr>
        <tr><th>Duration</th><td>Eight months</td></tr>
        <tr><th>Stack</th><td>Ruby on Rails, Jira REST API, Sidekiq, ActionCable, PostgreSQL</td></tr>
        <tr><th>Still running</th><td>The core design is still the production code path four years later</td></tr>
      </tbody>
    </table>

    <h2>The one-sentence version</h2>
    <p>I designed the layer that decides what a Jira project <em>means</em> inside an OKR platform: how issues become goals, how workflow states become measurable progress, how Jira's people become accountable owners.</p>

    <h2>The problem</h2>
    <p>"Integrate with Jira" sounds like an afternoon of REST calls. The demo is easy: pick a project, pick a goal, draw a line between them.</p>
    <p>The reality is that an OKR platform and an issue tracker disagree about almost everything they model: hierarchy, progress, ownership, and who's actually in charge. The integration is where those disagreements get resolved into a single number a director looks at in a quarterly review.</p>
    <pre class="mermaid">
    flowchart LR
        subgraph JIRA["Jira Cloud"]
            J1["Project → Epic → Task →&lt;br/&gt;Subtask (3 levels below project)"]
            J2["Arbitrary workflow statuses&lt;br/&gt;'In Review', 'QA', 'Blocked'…"]
            J3["Lead, Administrator, Member,&lt;br/&gt;Viewer, Assignee, Reporter, Watcher"]
            J4["Jira is the source of truth&lt;br/&gt;…or is it?"]
        end
        subgraph H5["Happy5 Performance"]
            H1["Project → Task&lt;br/&gt;(2 levels, hard validation)"]
            H2["A percentage.&lt;br/&gt;Rolled up from child records&lt;br/&gt;in our own database."]
            H3["Leader, Assignee, Reviewer,&lt;br/&gt;PMO, Stakeholder&lt;br/&gt;(drives approval + review flows)"]
            H4["Customers each have&lt;br/&gt;a different opinion"]
        end
        J1 -.->|"hierarchy&lt;br/&gt;boundary"| H1
        J2 -.->|"progress&lt;br/&gt;boundary"| H2
        J3 -.->|"identity + role&lt;br/&gt;boundary"| H3
        J4 -.->|"authority&lt;br/&gt;boundary"| H4
    </pre>

    <h2>How it's built</h2>
    <p>The integration is a Rails service sitting between the two systems. Jira Cloud pushes updates through webhooks and exposes a REST API for pulling project and issue data. A background layer built on Sidekiq does the actual translation, mapping Jira's projects, issues and workflow states into Happy5's goals, tasks and ownership, so a sync never blocks a web request the user is waiting on. Once a sync finishes, ActionCable pushes the result to the browser live, and everything lands in PostgreSQL alongside the rest of the platform's data.</p>
    <pre class="mermaid">
    sequenceDiagram
        participant U as User
        participant API as Rails API
        participant Q as Sidekiq
        participant J as Jira REST
        participant WS as ActionCable

        U->>API: Link a Jira project
        API->>API: validate &amp; persist the link
        API-->>U: 202 Accepted
        Note over U,API: request ends here

        API->>Q: enqueue sync job
        Q->>J: fetch project / issue data
        J-->>Q: payload
        Q->>Q: map Jira data into OKR goals
        Q->>Q: apply tenant configuration
        Q->>Q: persist changes
        Q->>Q: enqueue roll-up (progress) job
        Q->>Q: import sub-items (if requested)
        Q->>WS: broadcast result
        WS-->>U: UI updates live
    </pre>
    <p>Linking a real project used to run synchronously: fetch the project, its roles, every issue, every issue's watchers, then write it all back. Fine in a demo, far too slow against a large tenant. Moving it off the request path bought speed, but it also meant a lesson worth keeping: async buys you latency, not correctness. The steps above have to run in a strict order, or a child item can get created before its parent has finished syncing. Making something async is a design decision with its own failure modes, not a free performance win.</p>

    <h2>Key takeaways</h2>
    <ul>
      <li>Translate a foreign system's state into your own domain in one isolated layer. Don't let a partner's concepts leak into abstractions the rest of your platform depends on.</li>
      <li>When two systems model identity or ownership differently, define an explicit precedence order rather than a simple lookup table.</li>
      <li>Let customers configure where they disagree with your defaults, instead of forking behavior per client.</li>
      <li>Async trades latency for an ordering guarantee you now have to design and enforce yourself.</li>
    </ul>

    <p><em>Backend engineer on Happy5 Performance, 2021 to present.</em></p>

- title: "Drag-and-Drop Ordering That Survives Concurrency"
  slug: "h5-goal-custom-order"
  subtitle: >
    Designed drag-and-drop reordering for OKR goals using gap-based float ranking,
    so moving one item touches a single row instead of rewriting the list.
    Hardened with row locking after production exposed a real concurrency race.
  article_type: case_study
  status: published
  tags:
    - "Ruby on Rails"
    - "PostgreSQL"
    - "Sidekiq"
  button_label: "Product Page"
  button_url: "https://www.happy5.co/product/goals-okr-tracking-software"
  position: 2
  body: |
    <h2>At a glance</h2>
    <table>
      <tbody>
        <tr><th>Product</th><td>Happy5 Performance, a multi-tenant enterprise OKR and performance-management SaaS</td></tr>
        <tr><th>My role</th><td>Backend engineer, designed and hardened the feature end to end</td></tr>
        <tr><th>Duration</th><td>About a year, from first ship through hardening</td></tr>
        <tr><th>Stack</th><td>Ruby on Rails, PostgreSQL, Sidekiq</td></tr>
        <tr><th>Still running</th><td>Hardened after a real production race condition, still the live implementation</td></tr>
      </tbody>
    </table>

    <h2>The one-sentence version</h2>
    <p>I designed a way to let users drag and drop to reorder their goals that stays fast and correct no matter how long the list is or how many people are reordering it at once.</p>

    <h2>The problem</h2>
    <p>Drag and drop to reorder a list looks trivial until that list is shared across a multi-tenant database under concurrent load. The obvious approach, an integer position per row, means moving one item rewrites every row after it. On a long list that's hundreds of updates for a single drag, and a lock convoy on a table everyone touches at once.</p>
    <pre class="mermaid">
    flowchart LR
        subgraph NAIVE["Integer position"]
            N1["Move one item"] --> N2["Every row after it&lt;br/&gt;must shift"] --> N3["Writes grow with&lt;br/&gt;list length"]
        end
        subgraph GAP["Gap-based float rank"]
            G1["Move one item"] --> G2["new_rank = (rank_before +&lt;br/&gt;rank_after) / 2"] --> G3["One row written,&lt;br/&gt;regardless of list length"]
        end
    </pre>

    <h2>How it's built</h2>
    <p>Each item gets a rank instead of a position, a float that sits between its two neighbours. Moving an item into a new spot means computing one new rank and writing one row:</p>
    <pre><code>new_rank = (rank_before + rank_after) / 2</code></pre>
    <p>No cascade, no rewriting everything after it. Paginating through the list uses a cursor keyed on that same rank rather than an offset, since offset pagination breaks the moment anything moves out from under it. The ranks slowly lose precision as the same region gets split again and again, so a scheduled job periodically re-spreads them back to even gaps rather than checking on every write. Backfilling ranks for existing data runs as a background job too, not a migration, so it never holds a platform-wide transaction open.</p>

    <h2>What production taught me</h2>
    <p>Months after shipping, two people reordering the same list at the same time exposed a race the design hadn't accounted for.</p>
    <pre class="mermaid">
    sequenceDiagram
        participant A as User A
        participant B as User B
        participant DB as Database

        A->>DB: read neighbouring ranks
        B->>DB: read neighbouring ranks
        Note over A,B: both compute the same midpoint
        A->>DB: write new rank
        B->>DB: write new rank
        Note over DB: two rows now share an identical rank
    </pre>
    <p>The fix was row locking around the read and the write, so a second concurrent reorder waits instead of racing. Reordering is infrequent and user-initiated, so a brief wait costs far less than a silently corrupted order.</p>

    <h2>Key takeaways</h2>
    <ul>
      <li>A gap-based ranking scheme turns "insert into an ordered list" into a single write, regardless of list length. The bounded precision drift it trades for that is a fair deal, handled as scheduled maintenance instead of on the hot path.</li>
      <li>Pagination breaks the moment your sort key can change under the reader. Keying pagination on that same value, not a row offset, keeps it correct.</li>
      <li>A read-modify-write pattern is safe right up until two callers do it at the same time. If concurrent writes are possible, design the locking up front rather than waiting for production to find the race.</li>
      <li>Deleting logic that's causing bugs and earning nothing is a valid fix on its own, not just a fallback for when a better idea doesn't come along.</li>
    </ul>

    <p><em>Backend engineer on Happy5 Performance, 2021 to present.</em></p>

- title: "Architecting a RAG Chatbot for My Own Portfolio"
  slug: "rag-ai-chatbot"
  subtitle: >
    What curiosity from a workshop turned into: a retrieval-augmented chatbot
    built from scratch for this site, with its own retrieval, guardrails and
    rate limits.
  article_type: case_study
  status: published
  tags:
    - "Ruby on Rails"
    - "Groq API"
    - "Hotwire"
    - "RAG"
    - "LLM"
  button_label: "Try Here!"
  button_url: "#chat"
  position: 3
  body: |
    <h2>At a glance</h2>
    <table>
      <tbody>
        <tr><th>Product</th><td>The AI chat feature on this portfolio site</td></tr>
        <tr><th>My role</th><td>Designed and built it solo, end to end</td></tr>
        <tr><th>Sparked by</th><td>A workshop on building RAG-based chatbots</td></tr>
        <tr><th>Stack</th><td>Ruby on Rails, Groq API, Hotwire (Turbo Streams)</td></tr>
        <tr><th>Still running</th><td>Yes, live on this site right now</td></tr>
      </tbody>
    </table>

    <h2>The one-sentence version</h2>
    <p>I built a retrieval-augmented chatbot that answers questions about me by grounding a language model in a small knowledge base, instead of trusting it to know anything on its own.</p>

    <h2>Where it started</h2>
    <p>I've been a backend engineer for a while, comfortable enough that the part of me that used to chase new ideas had gone quiet. A workshop on building RAG-based chatbots, organised by <a href="https://www.linkedin.com/company/neotechpark/" target="_blank" rel="noopener noreferrer">NeoTechPark</a>, brought it back. I left with one question: could I build a real one, not a tutorial project, for something that actually mattered to me? This chatbot, live on this site right now, is the answer.</p>

    <h2>The system</h2>
    <p>A language model only knows what it was trained on, and my portfolio isn't in there. So instead of trying to teach the model about me directly, the system looks things up first, then hands the model exactly what it needs to answer, every time someone asks.</p>
    <pre class="mermaid">
    flowchart LR
        Q["Visitor's question"] --> RL{"Rate limit OK?"}
        RL -- no --> DENY["Polite decline,&lt;br/&gt;no API call made"]
        RL -- yes --> RET["Retrieve:&lt;br/&gt;score and rank knowledge&lt;br/&gt;base entries"]
        RET --> AUG["Augment:&lt;br/&gt;build a system prompt from&lt;br/&gt;the question, top facts, and rules"]
        AUG --> GEN["Generate:&lt;br/&gt;call the LLM API"]
        GEN --> ANS["Answer streamed&lt;br/&gt;back live"]
    </pre>
    <p>Retrieve, augment, generate: those three steps are the whole idea behind RAG. Everything else in the system exists to keep those three steps honest, affordable, and safe to expose to the public internet.</p>

    <h2>Retrieval, without a vector database</h2>
    <p>Most RAG tutorials reach for embeddings and a vector database first. For a knowledge base of a few dozen short facts about one person, that's more machinery than the problem needs. The system scores each entry by how many meaningful words it shares with the question, ranks them, and hands the model the strongest matches.</p>
    <pre class="mermaid">
    flowchart LR
        QQ["'Is he any good?'"] --> T["Strip to meaningful words"]
        T --> S["Score every entry by&lt;br/&gt;keyword overlap"]
        S --> RANK["Rank highest to lowest"]
        RANK --> TOP["Take the top few"]
        TOP --> FLOOR["Always include one&lt;br/&gt;contact-info entry"]
        FLOOR --> CTX["Final context handed&lt;br/&gt;to the model"]
    </pre>
    <p>A strict keyword filter is unforgiving: a question like "is he any good?" shares no words with anything in the knowledge base, so the system ranks rather than filters, always surfacing the best available matches even when the match is weak. One category, contact information, is always guaranteed a seat regardless of score, since the model is instructed to point people there and needs to actually be able to.</p>

    <h2>Keeping it honest</h2>
    <p>A language model will answer a question it has no answer for just as fluently as one it does. The fix has nothing to do with retrieval: it's a system prompt that states plainly what the assistant is for, what to do when it doesn't know something, and what to refuse. Trusting that instruction only happened after testing it on purpose, with questions it should decline and questions it has no facts for.</p>

    <h2>Keeping it safe to run</h2>
    <p>An API call costs money and can be abused, so every question passes through a rate limit before it ever reaches the model, per visitor and per session. The integration itself speaks the generic contract most LLM providers share rather than one provider's specific API, so switching providers later is a configuration change, not a rewrite.</p>

    <h2>Key takeaways</h2>
    <ul>
      <li>Retrieval doesn't require a vector database to start. Keyword scoring, ranked rather than filtered, is enough for a small, well-scoped knowledge base.</li>
      <li>Grounding a model in data solves what it knows. A system prompt is what makes it admit what it doesn't.</li>
      <li>Treat an LLM API like any other external dependency: rate-limit it, abstract the provider, and expect the model name to change under you.</li>
    </ul>

    <p><em>The chatbot described here is live on this site. Ask it something.</em></p>
