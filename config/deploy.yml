# Name of your application. Used to uniquely configure containers.
service: personal_portofolio

# Name of the container image. Combined with registry.server below to form
# the full reference: ghcr.io/daffa-pradana/personal_portofolio.
image: daffa-pradana/personal_portofolio

# Deploy to these servers. Single box for now — Biznet Gio NEO Lite,
# 103.89.5.84 — running the app, Postgres (as an accessory below), and the
# proxy all together.
servers:
  web:
    - 103.89.5.84

# Let's Encrypt SSL, handled automatically by kamal-proxy. Both the root
# domain and www resolve here (www is a CNAME to the root in NEO DNS), so
# both need to be in the certificate.
proxy:
  ssl: true
  host: daffapradana.com,www.daffapradana.com

# Credentials for the image registry — GitHub Container Registry, free,
# already have the account. Password comes from .kamal/secrets
# (KAMAL_REGISTRY_PASSWORD, a GitHub PAT with write:packages scope).
registry:
  server: ghcr.io
  username: daffa-pradana
  password:
    - KAMAL_REGISTRY_PASSWORD

# Inject ENV variables into containers (secrets come from .kamal/secrets).
env:
  secret:
    - RAILS_MASTER_KEY
    - GROQ_API_KEY
    - DATABASE_URL
    - ADMIN_EMAIL
    - ADMIN_PASSWORD
  clear:
    # Single server, so Solid Queue's supervisor runs inside the same Puma
    # process rather than a dedicated job host.
    SOLID_QUEUE_IN_PUMA: true

# The non-root user Biznet Gio's Ubuntu image ships by default. Has
# passwordless sudo (confirmed), which Kamal needs for Docker setup.
ssh:
  user: deploy
  keys: ["~/.ssh/biznet-personal-key"]
  keys_only: true

# Aliases are triggered with "bin/kamal <alias>". You can overwrite arguments on invocation:
# "bin/kamal logs -r job" will tail logs from the first server in the job section.
aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole"


# Use a persistent storage volume for Active Storage's local-disk uploads —
# this is what replaces Cloudflare R2. A VPS you keep doesn't have Railway's
# ephemeral-filesystem problem, so plain local disk is enough as long as it
# survives redeploys, which this volume guarantees.
volumes:
  - "personal_portofolio_storage:/rails/storage"


# Bridge fingerprinted assets, like JS and CSS, between versions to avoid
# hitting 404 on in-flight requests. Combines all files from new and old
# version inside the asset_path.
asset_path: /rails/public/assets

# Configure the image builder. Building locally (Daffa's own machine, same
# x86_64 architecture as the VPS) rather than on the VPS itself — a 2 vCPU/
# 2 GB box running bundle install + asset precompile while also serving
# traffic is the kind of resource contention worth avoiding.
builder:
  arch: amd64

# Postgres, running as an accessory on the same box, with its own
# persistent volume. Same single-Postgres-for-everything design this app
# already uses (primary/queue/cache/cable via Solid Stack) — just running
# in a container instead of a managed service.
accessories:
  db:
    image: postgres:16
    host: 103.89.5.84
    # Bound to localhost only — reachable from the app container over
    # Kamal's internal Docker network (as personal_portofolio-db), never
    # exposed to the public internet.
    port: "127.0.0.1:5432:5432"
    env:
      clear:
        POSTGRES_USER: personal_portofolio
        POSTGRES_DB: personal_portofolio_production
      secret:
        - POSTGRES_PASSWORD
    directories:
      - data:/var/lib/postgresql/data
