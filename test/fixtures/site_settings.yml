# cv_url and availability_message are blank here (even though the latter
# ships with a real seeded default) so the landing page tests exercise the
# "not configured" path unless a test sets one explicitly.
cv_url:
  key: cv_url
  value: ~

availability_message:
  key: availability_message
  value: ~

configured_example:
  key: configured_example
  value: "a value"

blank_example:
  key: blank_example
  value: ""
